[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wal-tat"
version = "0.1.0"
description = "Transactional adaptive ternarization with causal scoring and write-ahead logging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

